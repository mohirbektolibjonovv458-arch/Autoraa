<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080b" />
<title>Internet aloqasi yo'q — Avtora</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: radial-gradient(70% 50% at 50% 30%, #1d1f26 0%, #07080b 70%); color: #fff;
         display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .box { max-width: 380px; }
  img.logo { width: 150px; height: auto; }
  h1 { font-size: 22px; margin: 22px 0 8px; }
  p { color: #aab8cf; line-height: 1.5; margin: 0 0 22px; font-size: 15px; }
  button, a.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 800; color: #fff; text-decoration: none; }
  button { background: linear-gradient(135deg, #ff8a3d, #ee2b2f); }
  a.btn { margin-top: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
  small { display: block; margin-top: 18px; color: #7d8aa3; font-size: 12.5px; }
</style>
</head>
<body>
  <div class="box">
    <img src="/brand/avtora-logo.png" alt="Avtora" class="logo" />
    <h1>Internet aloqasi yo'q</h1>
    <p>Avtora ma'lumotlarni real vaqtda ko'rsatadi, shuning uchun internet kerak. Ulanishni tekshiring — aloqa tiklanishi bilan sahifa o'zi yangilanadi.</p>
    <button id="retry">Qayta urinish</button>
    <a class="btn" href="tel:112">Favqulodda holat: 112</a>
    <small>Mobil internet yoki Wi-Fi yoqilganini tekshiring.</small>
  </div>
  <script src="/offline.js"></script>
</body>
</html>
