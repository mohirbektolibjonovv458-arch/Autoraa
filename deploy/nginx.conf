# /etc/nginx/sites-available/avtora  (avtora.uz o'rniga o'z domeningizni yozing)
# So'ng: sudo ln -s /etc/nginx/sites-available/avtora /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d avtora.uz      (bepul HTTPS — GPS telefonda faqat HTTPS da ishlaydi)
server {
    listen 80;
    server_name avtora.uz www.avtora.uz;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
